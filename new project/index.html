<title>Framehand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F5F6F3; --surface:#FFFFFF; --sunken:#ECEEEA; --ink:#15191C; --ink-2:#2E3538; --muted:#5E6A6B; --line:#E0E4E0;
  --accent:#0E6B63; --accent-hover:#0B5A53; --accent-ink:#FFFFFF; --accent-soft:#DCEDE9;
  --film:#E9AE1C; --pencil:#D8452B; --ok:#1F7A4D; --ok-soft:#DDF0E5; --warn:#9A6408; --warn-soft:#FBEFD5; --bad:#B23A2A; --bad-soft:#F8E1DD;
  --shadow:0 1px 2px rgba(20,30,30,.06),0 6px 24px -8px rgba(20,30,30,.14);
  --shadow-lg:0 2px 6px rgba(20,30,30,.08),0 24px 60px -20px rgba(20,30,30,.28);
  --r:14px; --r-sm:10px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1314; --surface:#171C1E; --sunken:#1D2426; --ink:#E9ECEA; --ink-2:#C9D0CE; --muted:#95A2A1; --line:#283134;
    --accent:#45B5A8; --accent-hover:#5CC6B9; --accent-ink:#062220; --accent-soft:#163330;
    --film:#F2C04A; --pencil:#EE6A4F; --ok:#5BC48B; --ok-soft:#173226; --warn:#E6B24F; --warn-soft:#352914; --bad:#EE7B69; --bad-soft:#3A1E1A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px -8px rgba(0,0,0,.6);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1314; --surface:#171C1E; --sunken:#1D2426; --ink:#E9ECEA; --ink-2:#C9D0CE; --muted:#95A2A1; --line:#283134;
  --accent:#45B5A8; --accent-hover:#5CC6B9; --accent-ink:#062220; --accent-soft:#163330;
  --film:#F2C04A; --pencil:#EE6A4F; --ok:#5BC48B; --ok-soft:#173226; --warn:#E6B24F; --warn-soft:#352914; --bad:#EE7B69; --bad-soft:#3A1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px -8px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.eyebrow{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font:700 1.25rem/1 var(--display);letter-spacing:-.03em;color:var(--ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.logo svg{width:26px;height:26px;color:var(--accent)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.nav button:hover{background:var(--sunken)}
.nav button.on{color:var(--ink);background:var(--sunken)}
.badge-count{min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 .72rem/20px var(--body);text-align:center;padding:0 6px}
.nav .hide-sm{}
@media (max-width:720px){.nav .hide-sm{display:none}.top .wrap{gap:8px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-text{background:none;border:0;color:var(--accent);padding:6px 4px;font-weight:600;cursor:pointer}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:7px 14px;font-size:.9rem}
.btn svg{width:18px;height:18px}

/* photo tiles */
.ph{position:relative;overflow:hidden;background:var(--sunken);border-radius:var(--r-sm)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}

/* ---------- landing ---------- */
.hero{padding-block:56px 40px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.4rem,5.2vw,4.1rem);font-weight:750;letter-spacing:-.035em;line-height:1.02;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{font-size:1.13rem;color:var(--ink-2);max-width:34em;margin-top:18px}
.live{display:inline-flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.search{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);align-items:stretch}
.search .btn{grid-column:1/-1;margin:0 8px 8px!important;padding-block:13px}
.search label{border-bottom:0}
.search label{display:flex;flex-direction:column;padding:10px 16px;border-right:1px solid var(--line);min-width:0}
.search label:nth-child(3){border-right:0}
.search label span{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.search input,.search select{border:0;background:transparent;padding:4px 0;outline:none;font-weight:500;min-width:0;width:100%}
.search .btn{margin:8px;border-radius:12px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.quick .muted{font-size:.88rem;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:.88rem;cursor:pointer;color:var(--ink-2);font-weight:500}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.sheet{position:relative;background:#1A1A18;border-radius:6px;padding:26px 18px 18px;box-shadow:var(--shadow-lg);transform:rotate(1.2deg)}
.sheet-head{position:absolute;top:7px;left:18px;right:18px;display:flex;justify-content:space-between;font:500 .64rem/1 var(--mono);color:#C9A54A;letter-spacing:.08em;text-transform:uppercase}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.frame{position:relative}
.frame .ph{aspect-ratio:4/5;border-radius:2px}
.frame figcaption{display:flex;justify-content:space-between;font:500 .6rem/1 var(--mono);color:#C9A54A;margin-top:5px;letter-spacing:.04em}
.frame figcaption b{font-weight:500;color:#8C877A}
.pencil{position:absolute;inset:-12px -10px -8px -12px;pointer-events:none;overflow:visible}
.pencil path{fill:none;stroke:var(--pencil);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:0;animation:draw 1.1s .5s ease-out both}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.pick-note{position:absolute;right:-8px;bottom:-26px;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 14px;display:flex;gap:12px;align-items:center;transform:rotate(-1.2deg);max-width:280px}
.pick-note .av{width:40px;height:40px}
.pick-note strong{display:block;font-size:.95rem;line-height:1.2}
.pick-note .mono{color:var(--muted)}

.trust{display:flex;flex-wrap:wrap;gap:12px 36px;padding-block:28px;border-block:1px solid var(--line);margin-top:48px}
.trust div{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--ink-2)}
.trust svg{width:20px;height:20px;color:var(--accent);flex:none}

.section{padding-block:56px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700}
.sec-head p{color:var(--muted);margin-top:6px}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cat{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.cat .ph{aspect-ratio:4/3;border-radius:var(--r);transition:transform .25s}
.cat:hover .ph{transform:translateY(-3px)}
.cat h3{font-size:1.08rem;font-weight:650;margin-top:10px}
.cat p{font-size:.88rem;color:var(--muted)}

.tasks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
.task:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.task h3{font-size:1.1rem;font-weight:650}
.task .spec{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.88rem}
.task .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.price{font:700 1.15rem/1 var(--display)}
.price small{font:500 .8rem var(--body);color:var(--muted)}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.how li{list-style:none;padding-top:18px;border-top:2px solid var(--ink)}
.how li::before{counter-increment:s;content:"Step " counter(s);font:500 .74rem var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.how h3{font-size:1.25rem;margin-block:8px 6px}
.how p{color:var(--ink-2)}
.how{padding:0;margin:0}

.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px}
.quote blockquote{margin:0;font-size:1.02rem;color:var(--ink-2)}
.quote footer{display:flex;gap:10px;align-items:center;margin-top:auto;font-size:.9rem}
.quote footer .av{width:34px;height:34px;font-size:.75rem}

.pro-cta{background:var(--ink);color:var(--paper);border-radius:22px;padding:40px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.pro-cta h2{font-size:clamp(1.6rem,3vw,2.3rem)}
.pro-cta p{opacity:.78;margin-top:10px}
.pro-cta .stats{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pro-cta .stats b{display:block;font:700 1.9rem/1 var(--display)}
.pro-cta .stats span{font-size:.85rem;opacity:.7}
.pro-cta .btn-primary{margin-top:20px}

footer.site{border-top:1px solid var(--line);padding-block:28px 40px;margin-top:40px;color:var(--muted);font-size:.88rem}
footer.site .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* avatar */
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font:700 .95rem/1 var(--display);flex:none;width:48px;height:48px;letter-spacing:.02em}

/* stars */
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.rating svg{width:15px;height:15px;color:var(--film)}
.rating small{color:var(--muted);font-weight:400}

/* ---------- browse ---------- */
.browse{display:grid;grid-template-columns:260px 1fr;gap:32px;padding-block:32px 60px}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:22px}
.fgroup h4{font:600 .74rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips .chip{font-size:.83rem;padding:5px 10px}
input[type=range]{width:100%;accent-color:var(--accent)}
.range-val{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.93rem}
.check input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}
.select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.results-head h1{font-size:1.7rem;font-weight:700}
.results-head .select{width:auto}
.filter-toggle{display:none}
.list{display:flex;flex-direction:column;gap:16px}
.pro-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:1fr 190px;gap:20px;transition:box-shadow .2s,border-color .2s}
.pro-card:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 50%,var(--muted))}
.pc-top{display:flex;gap:14px;align-items:center}
.pc-top h3{font-size:1.2rem;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-top h3 button{all:unset;cursor:pointer}
.pc-top h3 button:hover{text-decoration:underline}
.pc-top h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pc-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;color:var(--muted);margin-top:3px;align-items:center}
.pc-meta span{display:inline-flex;align-items:center;gap:4px}
.pc-meta svg{width:14px;height:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 .7rem/1 var(--body);text-transform:uppercase;letter-spacing:.07em;padding:5px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.film{background:var(--warn-soft);color:var(--warn)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.strip .ph{aspect-ratio:1;cursor:zoom-in;border:0;padding:0}
.pitch{margin-top:14px;font-size:.94rem;color:var(--ink-2);background:var(--sunken);border-radius:10px;padding:10px 14px}
.pitch b{font-weight:600;color:var(--ink)}
.pc-side{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);padding-left:20px}
.pc-side .price{font-size:1.6rem}
.next{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--ok);font-weight:600}
.next svg{width:15px;height:15px}
.pc-side .btn{width:100%}
.pc-side .spacer{flex:1}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);height:260px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--sunken) 50%,transparent 70%);background-size:200% 100%;animation:shim 1s linear infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-50% 0}}
.empty{text-align:center;padding:60px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{font-size:1.3rem;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:18px}

/* ---------- profile ---------- */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);padding-top:24px;flex-wrap:wrap}
.crumbs button{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.crumbs button:focus-visible{outline:2px solid var(--accent)}
.profile{display:grid;grid-template-columns:1fr 360px;gap:40px;padding-block:20px 60px}
.p-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.p-head .av{width:84px;height:84px;font-size:1.6rem}
.p-head h1{font-size:clamp(1.8rem,3.4vw,2.5rem);font-weight:750}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:8px;margin-top:28px}
.gallery .ph{border:0;padding:0;cursor:zoom-in}
.gallery .ph:nth-child(1){grid-column:span 2;grid-row:span 2}
.gallery .ph:nth-child(6){grid-column:span 2}
.gallery .ph .exif{position:absolute;left:8px;bottom:8px;z-index:2;background:rgba(0,0,0,.55);color:#EDE6D2;padding:3px 6px;border-radius:4px;font:500 .62rem/1.2 var(--mono);opacity:0;transition:opacity .2s}
.gallery .ph:hover .exif,.gallery .ph:focus-visible .exif{opacity:1}
.block{margin-top:40px}
.block h2{font-size:1.4rem;font-weight:700;margin-bottom:14px}
.about{color:var(--ink-2);max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:20px}
.facts div{background:var(--surface);padding:14px 16px}
.facts b{display:block;font:700 1.25rem/1.1 var(--display)}
.facts span{font-size:.82rem;color:var(--muted)}
.gear{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.gear span{font:500 .76rem var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2)}
.pkgs{display:grid;gap:12px}
.pkg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:center}
.pkg h3{font-size:1.08rem;font-weight:650}
.pkg ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;color:var(--muted)}
.pkg ul li{display:flex;gap:5px;align-items:center}
.pkg ul svg{width:14px;height:14px;color:var(--accent)}
.pkg .right{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.reviews{display:grid;gap:0}
.review{padding-block:18px;border-bottom:1px solid var(--line)}
.review:first-child{padding-top:0}
.review header{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.review header .av{width:34px;height:34px;font-size:.74rem}
.review header strong{font-weight:600}
.review header .when{color:var(--muted);font-size:.85rem}
.review p{color:var(--ink-2)}
.stars{display:inline-flex;gap:1px}
.stars svg{width:14px;height:14px;color:var(--film)}
.stars svg.off{color:var(--line)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:1.15rem}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-block:10px 16px}
.slot-mini{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font-size:.84rem;cursor:pointer;font-weight:500}
.slot-mini:hover{border-color:var(--accent);color:var(--accent)}
.guarantee{display:flex;gap:10px;font-size:.85rem;color:var(--muted);margin-top:14px;align-items:flex-start}
.guarantee svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:1px}

/* ---------- booking ---------- */
.book{display:grid;grid-template-columns:1fr 340px;gap:40px;padding-block:24px 80px}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:18px 28px;padding:0;list-style:none}
.progress li{font-size:.84rem;color:var(--muted);font-weight:500}
.progress li::before{content:"";display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:8px;transition:background .3s}
.progress li.done::before,.progress li.cur::before{background:var(--accent)}
.progress li.cur{color:var(--ink);font-weight:600}

/* availability */
const SLOTS = ['8:00 AM','9:30 AM','11:00 AM','1:00 PM','2:30 PM','4:00 PM','5:30 PM'];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DAYS = Array.from({ length: 14 }, (_, i) => addDays(TODAY, i));
const fmtDay = d => d.toLocaleDateString('en-US', { weekday:'short' });
const fmtDate = d => d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
const fmtLong = d => d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
function avail(pro, i){
  const r = rng('av' + pro.id + i);
  const dayOff = r() < .22 || (i === 0 && r() < .5);
  const taken = SLOTS.map(() => r() < .38);
  if (i === 0){ const h = new Date().getHours(); SLOTS.forEach((s, k) => { if (k < Math.max(0, h - 7)) taken[k] = true; }); }
  const open = !dayOff && taken.some(t => !t);
  return { open, taken };
}
function nextSlot(pro, fromIdx = 0, toIdx = 13){
  for (let i = fromIdx; i <= toIdx; i++){ const a = avail(pro, i); if (a.open){ const k = a.taken.findIndex(t => !t); return { i, k, label: (i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : fmtDay(DAYS[i])) + ' ' + SLOTS[k] }; } }
  return null;
}

const app = $('#app');
let ROUTE = (location.hash || '').slice(1) || 'home';
function go(route){
  const same = route === ROUTE; ROUTE = route;
  if (!same){ try { history.pushState(null, '', '#' + route); } catch {} }
  render(); if (!same) window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { ROUTE = (location.hash || '').slice(1) || 'home'; render(); });
function parse(){
  const h = ROUTE;
  const m = h.match(/^(pro|book|done)-(.+)$/);
  return m ? { name: m[1], id: m[2] } : { name: h };
}
function render(){
  const r = parse();
  let html;
  if (r.name === 'browse') html = vBrowse();
  else if (r.name === 'pro' && PRO[r.id]) html = vPro(PRO[r.id]);
  else if (r.name === 'book' && PRO[r.id]) html = vBook(PRO[r.id]);
  else if (r.name === 'done' && S.bookings.find(b => b.id === r.id)) html = vDone(S.bookings.find(b => b.id === r.id));
  else if (r.name === 'bookings') html = vBookings();
  else html = vHome();
  app.innerHTML = html;
  app.firstElementChild?.classList.add('fade');
  $('#nav-browse').classList.toggle('on', r.name === 'browse' || r.name === 'pro');
  $('#nav-bookings').classList.toggle('on', r.name === 'bookings');
  if (r.name === 'done') scrollChat();
}

function bookingTotals(p, b){

}

      ${b.err.agree ? `<p class="errmsg" style="margin-top:8px">${b.err.agree}</p>` : ''}</div>`;

function validate(b, p){
  b.err = {};
  const k = p.packages[b.pkg];
  if (b.step === 1 && (b.day == null || b.slot == null)) b.err.when = b.day == null ? 'Choose a day to continue.' : 'Choose a time on ' + fmtLong(DAYS[b.day]) + '.';
  if (b.step === 2 && !k.remote && b.addr.trim().length < 4) b.err.addr = 'Add an address, park or venue so the photographer can plan travel.';
  if (b.step === 3 && !b.agree) b.err.agree = 'Tick the box to accept the cancellation policy.';
  return !Object.keys(b.err).length;
}
function submitBooking(p, b){
  const t = bookingTotals(p, b);
  if (b.editing){
    const bk = S.bookings.find(x => x.id === b.editing);
    Object.assign(bk, { date: DAYS[b.day].toISOString(), time: SLOTS[b.slot], status: 'requested' });
    pushMsg(bk.id, 'sys', `Rescheduled to ${fmtDate(DAYS[b.day])}, ${SLOTS[b.slot]}`);
    save(); S.booking = null;
    toast('Rescheduled. Waiting for ' + p.name.split(' ')[0] + ' to confirm the new time.');
    autoConfirm(bk.id);
    go('bookings'); return;
  }
  const id = 'FH-' + (40300 + Math.floor(Math.random() * 9000));
  const bk = { id, pro: p.id, pkg: b.pkg, pkgName: t.k.n + (t.k.hourly ? ` · ${b.hours}h` : ''), price: t.base, date: DAYS[b.day].toISOString(), time: SLOTS[b.slot], addr: t.k.remote ? 'Remote — upload link sent by email' : b.addr.trim(), notes: b.notes.trim(), addons: b.addons.slice(), fee: t.fee, total: t.total, status: 'requested', created: new Date().toISOString() };
  S.bookings.unshift(bk);
  S.chats[id] = [{ from:'sys', text:`Booking ${id} requested · ${fmtDate(DAYS[b.day])}, ${SLOTS[b.slot]}` }];
  save(); S.booking = null;
  go('done-' + id);
  autoConfirm(id);
}
function autoConfirm(id){
  setTimeout(() => {
    const bk = S.bookings.find(x => x.id === id); if (!bk || bk.status !== 'requested') return;
    const p = PRO[bk.pro];
    bk.status = 'confirmed';
    const first = p.name.split(' ')[0];
    const d = new Date(bk.date);
    pushMsg(id, 'them', bk.notes
      ? `Hi! ${first} here, and I’m confirmed for ${fmtDay(d)} at ${bk.time}. Thanks for the notes. I read them and I’ll plan around them. Anything else I should know about the space?`
      : `Hi! ${first} here, and I’m confirmed for ${fmtDay(d)} at ${bk.time}. What will you use the photos for? Knowing that helps me plan the shots.`);
    save();
    toast(`${first} confirmed your booking for ${fmtDate(d)}.`);
    const r = parse(); if ((r.name === 'done' && r.id === id) || r.name === 'bookings') render();
  }, 3200);
}
function pushMsg(id, from, text){ (S.chats[id] = S.chats[id] || []).push({ from, text }); }

      ${S.cancelId === bk.id ? `<div class="confirm-box"><p>Cancel this shoot? ${(d - Date.now()) > 864e5 ? 'It’s free because it’s more than 24 hours away.' : 'It’s within 24 hours, so a 50% fee applies.'}</p><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" data-action="keep">Keep booking</button><button class="btn btn-danger btn-sm" data-action="do-cancel" data-id="${bk.id}">Cancel booking</button></div></div>` : ''}

      ${bk.review ? `<div class="review-box"><div style="display:flex;gap:8px;align-items:center">${stars(bk.review.stars)}<span class="muted" style="font-size:.85rem">Your review</span></div>${bk.review.text ? `<p>${esc(bk.review.text)}</p>` : ''}</div>` : ''}

        ${bk.status === 'completed' && !bk.review && S.reviewId !== bk.id ? `<button class="btn btn-primary btn-sm" data-action="review" data-id="${bk.id}">${I.star}Leave a review</button>` : ''}

/* ============ lightbox ============ */
function openLb(pid, i){ S.lb = { pid, i, ret: document.activeElement }; drawLb(); }
function drawLb(){
  const lb = $('#lb');
  if (!S.lb){ lb.hidden = true; lb.innerHTML = ''; document.body.style.overflow = ''; return; }
  const p = PRO[S.lb.pid], ph = p.portfolio[S.lb.i];
  lb.innerHTML = `<button class="x" data-action="lb-close" aria-label="Close">${I.x}</button>
    <button class="nav-l" data-action="lb-step" data-d="-1" aria-label="Previous photo">${I.chevL}</button>
    <figure><div class="ph">${img(ph.kind, ph.seed, CAT[ph.cat].name + ' photo by ' + p.name, 800, 1000)}</div>
    <figcaption><span>${p.name} · ${CAT[ph.cat].name}</span><span>Photo: ${esc(credit(ph.kind, ph.seed))} / Unsplash</span><span>${S.lb.i + 1} / ${p.portfolio.length}</span></figcaption></figure>
    <button class="nav-r" data-action="lb-step" data-d="1" aria-label="Next photo">${I.chevR}</button>`;
  lb.hidden = false; document.body.style.overflow = 'hidden';

/* ============ toast ============ */
let toastT;
function toast(msg){
  const t = $('#toast'); t.innerHTML = I.check.replace('stroke="currentColor"','stroke="currentColor" style="color:var(--film)"') + '<span>' + esc(msg) + '</span>';
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3400);
}

/* ============ events ============ */
function runSearch(){
  S.f.cats = []; S.loading = true; go('browse');
  setTimeout(() => { S.loading = false; if (parse().name === 'browse') render(); }, 350);
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action;
  const b = S.booking, p = b && PRO[b.pro];
  switch (act){
    case 'how': if (parse().name !== 'home') go('home'); $('#how')?.scrollIntoView(); break;
    case 'quick': S.q = a.dataset.q; runSearch(); break;
    case 'cat': S.q = ''; runSearch(); S.f.cats = [a.dataset.cat]; render(); break;
    case 'become': toast('Pro applications aren’t part of this prototype yet.'); break;
    case 'fcat': { const c = a.dataset.cat; const cur = filtered().cats.slice(); S.q = ''; S.f.cats = cur.includes(c) ? cur.filter(x => x !== c) : [...cur, c]; render(); break; }
    case 'reset': S.q = ''; S.when = 'any'; S.f = { cats: [], max: 600, minRating: 0, rush: false, elite: false, sort: S.f.sort }; render(); break;
    case 'toggle-filters': S.filtersOpen = !S.filtersOpen; render(); break;
    case 'lb': openLb(a.dataset.pro, +a.dataset.i); break;
    case 'lb-close': { const r = S.lb?.ret; S.lb = null; drawLb(); r?.focus?.(); break; }
    case 'lb-step': { const n = PRO[S.lb.pid].portfolio.length; S.lb.i = (S.lb.i + +a.dataset.d + n) % n; drawLb(); break; }
    case 'book': {
      const o = {}; if (a.dataset.pkg != null) o.pkg = +a.dataset.pkg; if (a.dataset.day != null){ o.day = +a.dataset.day; o.slot = +a.dataset.slot; }
      startBooking(a.dataset.pro, o); break;
    }
    case 'pkg': if (e.target.closest('[data-stop]')) break; b.pkg = +a.dataset.i; render(); break;
    case 'hrs': e.stopPropagation(); b.hours = Math.max(1, Math.min(8, b.hours + +a.dataset.d)); render(); break;
    case 'day': b.day = +a.dataset.i; b.slot = null; b.err = {}; render(); break;
    case 'slot': b.slot = +a.dataset.k; b.err = {}; render(); break;
    case 'sugg': { const ta = $('#b-notes'); b.notes = (ta.value.trim() ? ta.value.trim() + '\n' : '') + a.dataset.s; render(); $('#b-notes')?.focus(); break; }
    case 'step': b.step = +a.dataset.s; render(); window.scrollTo(0,0); break;
    case 'prev': b.step = Math.max(0, b.step - 1); b.err = {}; render(); window.scrollTo(0,0); break;
    case 'next': {
      syncFields();
      if (!validate(b, p)){ render(); const er = $('.errmsg'); er?.scrollIntoView({ block:'center' }); if (b.err.addr) $('#b-addr')?.focus(); break; }
      if (b.step === 3){ submitBooking(p, b); break; }
      b.step++; render(); window.scrollTo(0,0); break;
    }
    case 'copycal': {
      const bk = S.bookings.find(x => x.id === a.dataset.id), pr = PRO[bk.pro];
      const txt = `Photo shoot with ${pr.name} (Framehand ${bk.id})\n${fmtLong(new Date(bk.date))}, ${bk.time}\n${bk.addr}\n${bk.pkgName}`;
      const fb = () => { const ta = $('#cal-fallback'); ta.value = txt; ta.hidden = false; ta.select(); toast('Select and copy the details below.'); };
      try { navigator.clipboard.writeText(txt).then(() => toast('Calendar details copied. Paste them into your calendar.'), fb); } catch { fb(); }
      break;
    }
    case 'tab': S.bkTab = a.dataset.t; S.cancelId = null; render(); break;
    case 'cancel': S.cancelId = a.dataset.id; render(); break;
    case 'keep': S.cancelId = null; render(); break;
    case 'do-cancel': { const bk = S.bookings.find(x => x.id === a.dataset.id); bk.status = 'cancelled'; S.cancelId = null; save(); toast('Booking cancelled. You won’t be charged.'); render(); break; }
    case 'resched': {
      const bk = S.bookings.find(x => x.id === a.dataset.id);
      const pr = PRO[bk.pro];
      S.booking = { pro: pr.id, step: 1, pkg: bk.pkg, hours: 2, day: null, slot: null, addr: bk.addr, notes: bk.notes, addons: bk.addons.slice(), agree: true, err: {}, editing: bk.id };
      go('book-' + pr.id); break;
    }
    case 'review': S.reviewId = a.dataset.id; S.reviewDraft = { stars: 5, text: '' }; render(); $('#r-text')?.focus(); break;
    case 'rstar': S.reviewDraft.text = $('#r-text')?.value || ''; S.reviewDraft.stars = +a.dataset.n; render(); break;
    case 'rcancel': S.reviewId = null; render(); break;
    case 'rsubmit': {
      const bk = S.bookings.find(x => x.id === a.dataset.id);
      bk.review = { stars: S.reviewDraft.stars, text: ($('#r-text')?.value || '').trim() };
      PRO[bk.pro].reviews.unshift({ cat: PRO[bk.pro].cats[0], who: 'You', stars: bk.review.stars, text: bk.review.text || 'Great shoot.', when: 'just now' });
      S.reviewId = null; save(); toast('Thanks! Your review is live on ' + PRO[bk.pro].name.split(' ')[0] + '’s profile.'); render(); break;
    }
  }
});
function syncFields(){
  const b = S.booking; if (!b) return;
  const ad = $('#b-addr'); if (ad) b.addr = ad.value;
  const nt = $('#b-notes'); if (nt) b.notes = nt.value;
  const ag = $('#b-agree'); if (ag) b.agree = ag.checked;
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'search'){ S.q = $('#q').value; S.hood = $('#hood').value; S.when = $('#when').value; runSearch(); }
  if (e.target.id === 'chat-form'){
    const inp = $('#chat-in'), text = inp.value.trim(); if (!text) return;
    const id = e.target.dataset.id; pushMsg(id, 'me', text); save(); inp.value = '';
    const m = $('#msgs'); m.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}</div><div class="msg them" id="typing"><span class="typing"><i></i><i></i><i></i></span></div>`); scrollChat();
    setTimeout(() => {
      const n = (S.chats[id] || []).filter(x => x.from === 'me').length;
      pushMsg(id, 'them', REPLIES[(n - 1) % REPLIES.length]); save();
      $('#typing')?.remove();
      const mm = $('#msgs'); if (mm && $('#chat-form')?.dataset.id === id){ mm.insertAdjacentHTML('beforeend', `<div class="msg them">${esc(REPLIES[(n - 1) % REPLIES.length])}</div>`); scrollChat(); }
    }, 1500);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-hood'){ S.hood = t.value; render(); }
  else if (t.id === 'f-when'){ S.when = t.value; render(); }
  else if (t.id === 'f-rating'){ S.f.minRating = +t.value; render(); }
  else if (t.id === 'f-rush'){ S.f.rush = t.checked; render(); }
  else if (t.id === 'f-elite'){ S.f.elite = t.checked; render(); }
  else if (t.id === 'f-sort'){ S.f.sort = t.value; render(); }
  else if (t.id === 'f-max'){ S.f.max = +t.value; render(); }
  else if (t.dataset.addon){ syncFields(); const b = S.booking; b.addons = t.checked ? [...b.addons, t.dataset.addon] : b.addons.filter(x => x !== t.dataset.addon); render(); }
  else if (t.id === 'b-agree'){ S.booking.agree = t.checked; S.booking.err = {}; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-max'){ $('#f-max-v').textContent = +e.target.value >= 600 ? 'Any' : money(+e.target.value); }
  if (e.target.id === 'b-addr' || e.target.id === 'b-notes') syncFields();
});
document.addEventListener('keydown', e => {
  if (!S.lb && (e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.opt[role=radio]')){ e.preventDefault(); e.target.click(); return; }
  if (!S.lb) return;
  if (e.key === 'Escape'){ const r = S.lb.ret; S.lb = null; drawLb(); r?.focus?.(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ const n = PRO[S.lb.pid].portfolio.length; S.lb.i = (S.lb.i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; drawLb(); }
  else if (e.key === 'Tab'){ const f = [...$('#lb').querySelectorAll('button')]; const i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
});
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb'){ S.lb = null; drawLb(); } });

updateCount();
render();
})();
</script>
